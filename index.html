<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Шакира">
<meta name="theme-color" content="#fbf4ee">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" id="touchIcon" href="icon-180.png">
<title>Шакира — дневник здоровья</title>
<style>
:root{
  --bg:#fbf4ee;--card:#ffffff;--ink:#3a2418;--muted:#94786a;--line:#f0e2d8;
  --accent:#a8481f;--accent2:#d98a5a;--soft:#f7e4d6;
  --vac:#7c6cf0;--tick:#e38b2c;--worm:#3fae7a;--med:#c0503a;--vet:#3a8fd8;--groom:#c46bd1;--note:#8d8292;
  --red:#d9474f;--r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
header{padding:14px 18px 4px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:28px;margin:0;font-weight:800;letter-spacing:-.5px}
main{padding:6px 14px 20px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:10px 0;box-shadow:0 2px 10px rgba(150,90,50,.08)}
.hero{background:linear-gradient(135deg,#f6dcc6,#eab48c 60%,#d9875a);display:flex;gap:14px;align-items:center}
.avatar{width:78px;height:78px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:44px;flex:none;overflow:hidden;border:3px solid #fff}
.avatar img{width:100%;height:100%;object-fit:cover}
.hero h2{margin:0;font-size:24px}
.hero .sub{color:#5e3a26;font-size:14px}
.stats{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.75);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
h3{margin:4px 2px 8px;font-size:18px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.tap{cursor:pointer}.row .chev{color:#c9bfc6;font-size:20px;margin-left:2px}
.tk{background:color-mix(in srgb,var(--accent) 6%,white);border-radius:16px;padding:12px 14px;margin-top:12px}
.tk-h{font-weight:800;font-size:15px;margin-bottom:4px}
.btn[disabled]{opacity:.38}
.due{border:2px solid var(--accent)}
.wrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.wrow:last-child{border-bottom:0}.wrow small{display:block;color:#8d8292;font-size:12px}.wrow .dlt{font-size:12px;font-weight:700;min-width:52px;text-align:right}
.ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.grow{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{color:var(--muted);font-size:13px}
.badge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.b-late{background:#fde0e2;color:var(--red)}.b-soon{background:#fff0dc;color:#b06a12}.b-ok{background:#e9f6ef;color:#2c8a5c}
button{font:inherit;border:0;cursor:pointer}
.btn{background:var(--accent);color:#fff;border-radius:14px;padding:12px 16px;font-weight:700;width:100%}
.btn.sec{background:var(--soft);color:var(--accent)}
.btn.ghost{background:#f2e8e0;color:var(--ink)}
.btn.small{width:auto;padding:7px 12px;font-size:14px;border-radius:11px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{background:var(--card);border-radius:16px;padding:12px 4px;font-size:12px;font-weight:600;color:var(--ink);box-shadow:0 2px 8px rgba(150,90,50,.08)}
.quick button span{display:block;font-size:24px;margin-bottom:4px}
.empty{color:var(--muted);text-align:center;padding:14px 4px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;background:none;color:var(--muted);font-size:11px;font-weight:600;padding:4px 0}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--accent)}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead b{font-size:18px;text-transform:capitalize}
.calhead button{background:var(--soft);color:var(--accent);width:38px;height:38px;border-radius:12px;font-size:18px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:12px;color:var(--muted);font-weight:600;padding:4px 0}
.day{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;position:relative;background:none;color:var(--ink)}
.day.out{opacity:.3}
.day.today{border:2px solid var(--accent);font-weight:800}
.day.sel{background:var(--accent);color:#fff}
.day.bday::after{content:"🎂";position:absolute;top:-4px;right:-2px;font-size:11px}
.dots{display:flex;gap:2px;height:6px;margin-top:2px}
.dots i{width:5px;height:5px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
/* sheet */
.mask{position:fixed;inset:0;background:rgba(40,20,10,.35);z-index:20;display:none;align-items:flex-end}
.mask.open{display:flex}
.sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.grab{width:40px;height:5px;border-radius:3px;background:#dcc6b6;margin:2px auto 10px}
label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:12px 2px 5px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:14px;color:var(--ink)}
.cats button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{background:var(--soft);color:#8a3a16;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
.actions{display:flex;gap:8px;margin-top:16px}
.filter{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;color:var(--ink);border:1px solid var(--line)}
.filter button.on{background:var(--ink);color:#fff}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:30;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
svg.chart{width:100%;height:150px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border:0}.kv span{color:var(--muted)}
</style>
</head>

</nav>

<div class="toast" id="toast"></div>

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5); // b-a
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const fmt=s=>{const d=parse(s);return d.getDate()+' '+MON[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')};
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c}
function age(birth){
  if(!birth)return '';const b=parse(birth),t=new Date();
  let m=(t.getFullYear()-b.getFullYear())*12+t.getMonth()-b.getMonth();let d=t.getDate()-b.getDate();
  if(d<0){m--;const pm=new Date(t.getFullYear(),t.getMonth(),0).getDate();d+=pm}
  const y=Math.floor(m/12);m%=12;const p=[];
  if(y)p.push(y+' '+plural(y,'год','года','лет'));if(m)p.push(m+' '+plural(m,'месяц','месяца','месяцев'));
  if(!y&&d)p.push(d+' '+plural(d,'день','дня','дней'));return p.join(' ')||'новорождённая';
}
function ageAt(birth,date){
  if(!birth||!date||date<birth)return '';const b=parse(birth),t=parse(date);
  let m=(t.getFullYear()-b.getFullYear())*12+t.getMonth()-b.getMonth();let d=t.getDate()-b.getDate();
  if(d<0){m--;d+=new Date(t.getFullYear(),t.getMonth(),0).getDate()}
  const y=Math.floor(m/12);m%=12;const p=[];
  if(y)p.push(y+' '+plural(y,'год','года','лет'));if(m)p.push(m+' мес.');if(!y&&d)p.push(d+' дн.');
  return p.join(' ')||'0 дн.';
}
function repeatText(n){if(!n)return '';if(n===1)return 'каждый день';if(n%365===0)return 'раз в '+(n/365>1?n/365+' года':'год');if(n%30===0&&n<365)return 'раз в '+(n/30>1?n/30+' '+plural(n/30,'месяц','месяца','месяцев'):'месяц');if(n%7===0)return 'раз в '+(n/7>1?n/7+' '+plural(n/7,'неделю','недели','недель'):'неделю');return 'раз в '+n+' '+plural(n,'день','дня','дней')}

function upcoming(){
  const out=D.plans.map(p=>({...p,kind:'plan'}));
  const last={};
  D.records.forEach(r=>{if(!r.repeat)return;const k=r.cat+'|'+r.title.trim().toLowerCase();if(!last[k]||r.date>last[k].date)last[k]=r});
  Object.values(last).forEach(r=>{
    if(r.stopped)return;
    const next=(r.nextDate&&r.nextDate>r.date)?r.nextDate:addDays(r.date,r.repeat);
    if(r.until&&next>r.until)return;
    out.push({id:'auto-'+r.id,cat:r.cat,title:r.title,date:next,time:r.nextTime||r.time||'',note:r.note||'',repeat:r.repeat,until:r.until,kind:'auto',src:r.id});
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function badge(dt){
  const n=diff(today(),dt);
  if(n<0)return `<span class="badge b-late">просрочено ${-n} дн.</span>`;
  if(n===0)return `<span class="badge b-soon">сегодня</span>`;
  if(n===1)return `<span class="badge b-soon">завтра</span>`;
  if(n<=7)return `<span class="badge b-soon">через ${n} дн.</span>`;
  return `<span class="badge b-ok">через ${n} дн.</span>`;
}

function eventsMap(from,to){
  const map={};const add=(d,e)=>{if(d<from||d>to)return;(map[d]=map[d]||[]).push(e)};
  D.records.forEach(r=>add(r.date,{...r,done:true}));
  upcoming().forEach(u=>{
    add(u.date,u);
    if(u.repeat&&u.kind==='auto'){let d=u.date,k=0;while(k++<400){d=addDays(d,u.repeat);if(d>to||(u.until&&d>u.until))break;add(d,{...u,date:d})}}
  });
  return map;
}

function weightRows(ws,n){
  if(!ws.length)return '<div class="empty">Добавьте первое взвешивание</div>';
  const b=D.dog.birth;const rows=ws.map((w,i)=>({w,d:i?Math.round((w.kg-ws[i-1].kg)*100)/100:null})).reverse();
  return (n?rows.slice(0,n):rows).map(({w,d})=>`<div class="wrow" onclick="delWeight('${w.id}')"><div>${b?ageAt(b,w.date):fmt(w.date)}<small>${fmt(w.date)}</small></div>
    <span class="dlt" style="color:${d>0?'#3fae7a':d<0?'var(--red)':'#8d8292'}">${d===null?'':(d>0?'+':'')+String(d).replace('.',',')}</span><b>${String(w.kg).replace('.',',')} кг</b></div>`).join('');
}
function chart(ws){
  const W=320,H=150,p=24,b=D.dog.birth;
  const xs=ws.map(w=>b?diff(b,w.date):parse(w.date).getTime()/864e5),ys=ws.map(w=>+w.kg);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys)*0.9,y1=Math.max(...ys)*1.06;
  const X=t=>p+(W-2*p)*((t-x0)/((x1-x0)||1)),Y=v=>H-p-(H-2*p)*((v-y0)/((y1-y0)||1));
  const pts=ws.map((w,i)=>[X(xs[i]),Y(ys[i])]);
  const lab=i=>b?ageAt(b,ws[i].date).replace(/ (\d+ дн\.)$/,''):fmt(ws[i].date);
  const show=new Set([0,ws.length-1,Math.floor((ws.length-1)/2)]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>
    ${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="#fff" stroke="var(--accent)" stroke-width="2"/><text x="${q[0]}" y="${q[1]-9}" font-size="10" text-anchor="middle" fill="#8d8292">${String(ys[i]).replace('.',',')}</text>`).join('')}
    ${[...show].map(i=>`<text x="${pts[i][0]}" y="${H-6}" font-size="9" text-anchor="${i===0?'start':i===ws.length-1?'end':'middle'}" fill="#b0a5ac">${lab(i)}</text>`).join('')}</svg>`;
}
function weightCard(){

function saveF(doneNow){
  keepInputs();const stop=document.getElementById('f-stop');
  if(!F.title.trim()){F.title=CATS[F.cat].n}
  if(!F.date){toast('Укажите дату');return}
  if((F.mode==='rec'||(F.mode==='new'&&F.status==='done'))&&F.date>today()){toast('Эта дата ещё не наступила. Выберите «Запланировать»');return}
  const base={cat:F.cat,title:F.title.trim(),date:F.date,note:F.note.trim(),repeat:+F.repeat||0,until:F.until||''};
  if(F.mode==='rec'){Object.assign(D.records.find(r=>r.id===F.id),base,{stopped:stop?stop.checked:false})}
  else if(F.mode==='plan'){
    D.plans=D.plans.filter(p=>p.id!==F.id);
    if(doneNow)D.records.push({...base,id:uid(),date:today()});else D.plans.push({...base,id:F.id});

document.getElementById('photoIn').onchange=e=>{
  const file=e.target.files[0];if(!file)return;const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const c=document.createElement('canvas');const s=320;const k=Math.max(s/img.width,s/img.height);c.width=c.height=s;
    const g=c.getContext('2d');g.drawImage(img,(s-img.width*k)/2,(s-img.height*k)/2,img.width*k,img.height*k);
    D.dog.photo=c.toDataURL('image/jpeg',.82);save();render();URL.revokeObjectURL(url)};img.src=url;e.target.value='';
};
async function shareFile(name,text,type){
  const file=new File([text],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
}

document.getElementById('fileIn').onchange=e=>{
  const file=e.target.files[0];if(!file)return;const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.dog)throw 0;if(!confirm('Заменить текущие данные данными из копии?'))return;D=Object.assign(structuredClone(DEFAULT),o);save();render();toast('Копия загружена')}catch(_){toast('Это не файл копии')}};
  rd.readAsText(file);e.target.value='';
};

/* Календарь: iPhone открывает .ics с адреса сайта и предлагает «Добавить все».
   Файл кладём в кэш, сервис-воркер отдаёт его по адресу calendar.ics */
let lastICS=null;
async function openICS(text){
  lastICS=text;
  try{if(navigator.serviceWorker&&navigator.serviceWorker.controller){const c=await caches.open('ics');
    await c.put(new Request('calendar.ics'),new Response(text,{headers:{'Content-Type':'text/calendar; charset=utf-8'}}));
    location.href='calendar.ics?t='+Date.now();return}}catch(e){}
  location.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(text);
}
function saveICS(){const t=buildICS();if(t)shareFile(`${D.dog.name||'pet'}-reminders.ics`,t,'text/calendar')}
function exportICS(){const t=buildICS();if(t)openICS(t)}
function buildICS(){
  const up=upcoming().filter(u=>u.date>=addDays(today(),-1));
  if(!up.length){toast('Нет запланированных дел');return null}
  const [hh,mm]=(D.remindTime||'10:00').split(':');const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const escI=s=>String(s).replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  let L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Pet Health//RU','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+escI(D.dog.name+' — здоровье')];
  up.forEach(u=>{
    const d=u.date.replace(/-/g,'');const [h2,m2]=(u.time||(hh+':'+mm)).split(':');const dt=d+'T'+h2+m2+'00';
    L.push('BEGIN:VEVENT','UID:'+u.id+'@pet-health','DTSTAMP:'+stamp,'DTSTART:'+dt,'DURATION:PT15M',
      'SUMMARY:'+escI(CATS[u.cat].i+' '+D.dog.name+': '+u.title),'DESCRIPTION:'+escI((u.note||'')+(u.repeat?' ('+repeatText(u.repeat)+')':'')));
    if(u.repeat&&u.kind==='auto'){let rr='RRULE:FREQ=DAILY;INTERVAL='+u.repeat;if(u.until)rr+=';UNTIL='+u.until.replace(/-/g,'')+'T235959';else if(u.repeat>1)rr+=';COUNT=6';else rr+=';COUNT=30';L.push(rr)}
    if(u.repeat!==1)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Завтра','TRIGGER:-P1D','END:VALARM');
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Сегодня','TRIGGER:PT0M','END:VALARM');
    if(u.repeat!==1)['P1D','P2D'].forEach(x=>L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Если ещё не сделали — отметьте в приложении','TRIGGER;RELATED=START:'+x,'END:VALARM'));
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}


/* ===================== ГАВ! ===================== */
let AC;
function bark(times=2){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    for(let i=0;i<times;i++){const t=AC.currentTime+i*0.28;
      const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
      o.type='sawtooth';o.frequency.setValueAtTime(820,t);o.frequency.exponentialRampToValueAtTime(380,t+0.13);
      f.type='bandpass';f.frequency.value=1100;f.Q.value=1.4;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.9,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+0.17);
      const n=AC.createBufferSource(),buf=AC.createBuffer(1,AC.sampleRate*0.17,AC.sampleRate),d=buf.getChannelData(0);
      for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*0.35;n.buffer=buf;
      o.connect(f);n.connect(f);f.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.18);n.start(t);
    }
    if(navigator.vibrate)navigator.vibrate([80,120,80]);
  }catch(e){}
}
function dueNow(){return upcoming().filter(u=>u.date<=today()).length}
// iPhone разрешает звук только после касания: первое касание после открытия — «гав», если есть дела на сегодня/просрочка
let barked=false;
function firstTouch(){if(barked)return;barked=true;const n=dueNow();if(n){bark(n>1?3:2);toast('🐩 Гав! Сегодня: '+n+' '+plural(n,'дело','дела','дел'))}}
document.addEventListener('touchstart',firstTouch,{passive:true});document.addEventListener('click',firstTouch);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')barked=false});

/* Иконка «На экран Домой» = текущее фото в профиле */
let iconKey='';
function updateIcon(){const ph=D.dog.photo;if(!ph||iconKey===ph.length+'')return;iconKey=ph.length+'';
  const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=180;c.getContext('2d').drawImage(im,0,0,180,180);
    try{document.getElementById('touchIcon').href=c.toDataURL('image/png')}catch(e){}};im.src=ph}
/* ===================== ПРОЧЕЕ ===================== */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(tab==='cal'){calMonth=new Date();selDay=today()}render()});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
